apply plugin: 'com.android.tools.java-library'
apply plugin: 'com.android.tools.publish'
apply plugin: 'jacoco-tools-base'

repositories {
    maven { url = uri(rootProject.cloneArtifacts.repository) }
}

dependencies {
    implementation project(':base:annotations')
    implementation libs.guava
    implementation libs.apache_httpmime
    implementation libs.apache_httpcore
    implementation libs.apache_httpclient

    testImplementation libs.junit
    testImplementation libs.netty_all
    testImplementation libs.truth
    testImplementation libs.mockito_core
}

group = 'com.android.tools.analytics-library'
archivesBaseName = 'crash'
version = rootProject.ext.baseVersion

project.ext.pomName = 'Android Tools Analytics Crash Library'
project.ext.pomDesc = 'Helper Library for uploading crash reports.'
