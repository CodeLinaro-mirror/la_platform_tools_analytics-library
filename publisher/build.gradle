apply plugin: 'com.android.tools.java-library'
apply plugin: 'com.android.tools.publish'
apply plugin: 'com.android.tools.kotlin'

dependencies {
    implementation libs.com.android.tools.annotations
    implementation libs.com.android.tools.common
    implementation libs.com.android.tools.analyticsLibrary.protos
    implementation libs.com.android.tools.analyticsLibrary.shared
    implementation libs.protobuf
    implementation libs.guava

    testImplementation project(':base:testutils')
    testImplementation libs.junit
    testImplementation libs.truth
    testImplementation libs.com.android.tools.analyticsLibrary.tracker
}

group = 'com.android.tools.analytics-library'
archivesBaseName = 'publisher'
version = rootProject.ext.baseVersion

project.ext.pomName = 'Android Tools Analytics Publisher'
project.ext.pomDesc = 'Library for publishing usage analytics.'
