apply plugin: 'com.android.tools.java-library'
apply plugin: 'com.android.tools.publish'
apply plugin: 'application'

dependencies {
    implementation project(':base:annotations')
    implementation project(':analytics-library:protos')
    implementation project(':analytics-library:shared')
    implementation libs.protobuf
    implementation libs.guava
    implementation libs.gson

    testImplementation project(':base:testutils')
    testImplementation libs.junit
    testImplementation libs.truth
}

group = 'com.android.tools.analytics-library'
archivesBaseName = 'inspector'
version = rootProject.ext.baseVersion

mainClassName = "com.android.tools.analytics.AnalyticsInspector"
applicationDefaultJvmArgs = ["-ea", "-Xms2g", "-Xmx4g"]

project.ext.pomName = 'Android Tools Analytics Inspector'
project.ext.pomDesc = 'Tool for debugging usage analytics spool files.'
